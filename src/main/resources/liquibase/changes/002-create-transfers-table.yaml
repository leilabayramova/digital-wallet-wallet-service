databaseChangeLog:
  - changeSet:
      id: 002-create-transfers-table
      author: leyla

      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transfers
                    nullable: false

              - column:
                  name: source_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: target_wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: transfers
            columnNames: idempotency_key
            constraintName: uq_transfers_idempotency_key

      rollback:
        - dropTable:
            tableName: transfers
