server:
  port: 9092

spring:
  application:
    name: digital-wallet-wallet-service

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_wallet_wallet_db
    username: postgres

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    change-log: classpath:changelog-master.yaml

clients:
  user-service:
        url: http://localhost:9091

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000